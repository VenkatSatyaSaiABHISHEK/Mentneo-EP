<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <defs>
    <linearGradient id="leftFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="innerLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="innerRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C8EBF"/>
      <stop offset="100%" stop-color="#4B5B8A"/>
    </linearGradient>
  </defs>
  <!-- Left 3D diamond shape -->
  <polygon points="10,70 40,30 60,50 60,110 40,130 10,90" fill="url(#leftFace)"/>
  <!-- Left diamond highlight -->
  <polygon points="10,70 40,30 40,50 10,90" fill="url(#leftFace)" opacity="0.7"/>
  <!-- Right 3D diamond shape -->
  <polygon points="110,70 80,30 60,50 60,110 80,130 110,90" fill="url(#rightFace)"/>
  <!-- Right diamond highlight -->
  <polygon points="110,70 80,30 80,50 110,90" fill="url(#rightFace)" opacity="0.7"/>
  <!-- Top center face -->
  <polygon points="40,30 60,10 80,30 60,50" fill="url(#topFace)"/>
  <!-- Inner left shadow -->
  <polygon points="60,50 40,70 40,130 60,110" fill="url(#innerLeft)" opacity="0.6"/>
  <!-- Inner right shadow -->
  <polygon points="60,50 80,70 80,130 60,110" fill="url(#innerRight)" opacity="0.5"/>
</svg>
